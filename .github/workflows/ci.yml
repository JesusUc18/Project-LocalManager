name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore LocalManager.sln

      - name: Build
        run: dotnet build LocalManager.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test LocalManager.xUnit/LocalManager.xUnit.csproj --no-build --configuration Release --verbosity normal
